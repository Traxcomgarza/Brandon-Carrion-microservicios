version: "3.8"

services:
  servicio_a:
    build: ./servicio_a
    ports:
      - "5000:5000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SERVICIO_B_URL: http://servicio_b:5001
    networks:
      - red_interna
    depends_on:
      - servicio_b

  servicio_b:
    build: ./servicio_b
    # Sin ports: — no expuesto al exterior
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    networks:
      - red_interna

networks:
  red_interna:
    driver: bridge
